<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function hitungDiskon(totalBelanja) {
            let persen = 0;
            if (totalBelanja >= 200000) {
                persen = 20;

            } else if (totalBelanja >=100000) {
                persen = 10;
            }
            return (persen / 100) * totalBelanja;
        }

        let pembeli = prompt("Masukkan Nama Pembeli:");
        let barang1 = prompt("Masukkan Nama Barang:");
        let harga1 = parseInt(prompt("Masukkan Harga Barang1 (RP):"));

        let barang2 = prompt("Masukkan Nama Barang2:");
        let harga2 = parseInt(prompt("Masukkan Harga Barang2 (RP):"));

        let totalBelanja = harga1 + harga2;
        let nominalDiskon = hitungDiskon(totalBelanja);
        let totalBayar = totalBelanja - nominalDiskon;

        for (let i = 1; i <= 35; i++) { document.write("=");}
        document.write("<br><b>  STRUK TOKO ELEKTRONIK RPL </b><br>");
        for (let i = 1; i <= 35; i++) { document.write("=");}
        document.write("<br>");
        document.write("Nama Pembeli: " + pembeli + "<br>");
        document.write("Barang 1.: " + barang1 + " : RP " + harga1 + "<br>");
        document.write("Barang 2.: " + barang2 + " : RP " + harga2 + "<br>");
        for (let i = 1; i <= 35; i++) { document.write("=");}        
        document.write("<br>");

        document.write("Total Belanja: RP " + totalBelanja + "<br>");
        document.write("Potongan Diskon: RP " + nominalDiskon + "<br>");
        document.write("<b>Total Bayar: RP" + totalBayar + " </b><br>");
        for (let i = 1; i <= 35; i++) { document.write("=");}
        document.write("<br><b>  TERIMA KASIH TELAH BERBELANJA </b><br>");

    </script>
</body>
</html>
